<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-TF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX to PDF Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LaTeX to PDF Generator</h1>
    </header>
    <main>
        <div class="controls">
            <label for="latex-input">Enter your prompt for PDF generation:</label>
            <textarea id="latex-input" rows="10" placeholder="e.g., Create a document with a title 'My Report', a heading 'Section 1', and some text: 'This is the first paragraph.'"></textarea>
            <button id="generate-pdf">Generate PDF</button>
            <div id="loading-message" style="display: none; margin-top: 10px; text-align: center;"></div> 
            <button id="download-pdf" style="display: none; margin-top: 10px;">Download PDF</button>
        </div>
        <div class="pdf-display-area">
            <iframe id="pdf-viewer" width="100%" height="100%"></iframe>
        </div>
        <div id="error-message" class="error-message" style="display: none;"></div>
    </main>
    <!-- Add these before your existing script.js -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/pdfmake.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/vfs_fonts.js'></script>
    <script src="script.js"></script>
</body>
</html>
